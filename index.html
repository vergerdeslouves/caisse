<html lang="fr">
<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f6f1;--surf:#fff;--tx:#383838;--mut:#777468;--ac:#a2bd54;--act:#1f2410;--gr:#a2bd54;--bd:#dedbcf;--warn:#a8321f;--hd:#efede6;--hdt:#4a4a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1d18;--surf:#262922;--tx:#ecebe4;--mut:#a09d90;--ac:#a2bd54;--act:#1f2410;--gr:#a2bd54;--bd:#3a3e33;--warn:#ff9a86;--hd:#14160f;--hdt:#ecebe4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1d18;--surf:#262922;--tx:#ecebe4;--mut:#a09d90;--ac:#a2bd54;--act:#1f2410;--gr:#a2bd54;--bd:#3a3e33;--warn:#ff9a86;--hd:#14160f;--hdt:#ecebe4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.4 "Lexend",system-ui,-apple-system,"Segoe UI",sans-serif}
.topbar{background:var(--gr);color:var(--act);font-size:12px;padding:6px 16px;text-align:right}
header{display:flex;align-items:center;padding:10px 16px;background:var(--hd);color:var(--hdt)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:68px;height:68px;border-radius:50%;background:#fff;flex:none}
.script{font-family:"Allura","Brush Script MT",cursive;font-size:38px;line-height:1;display:block}
header small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.75;margin-top:2px}
.band{height:10px;background:var(--gr)}
h3{font-family:"Lora",Georgia,serif}
nav{display:flex;gap:6px;padding:10px 16px}
button{font:inherit;color:inherit;border:1px solid var(--bd);background:var(--surf);border-radius:10px;padding:10px 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5}
button.dng{color:var(--warn)}
main{padding:0 16px 24px;max-width:1150px;margin:auto}
.caisse{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){.caisse{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.ticket{position:sticky;top:8px;align-self:start}}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.cats button{flex:none;white-space:nowrap;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;text-align:left;border-left:5px solid var(--gr)}
.prod b{font-family:"Lora",Georgia,serif;font-size:14px;font-weight:600}.prod span{color:var(--mut)}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.line .n{flex:1}
.q{display:flex;align-items:center;gap:6px}.q button{padding:2px 10px}
.tot{display:flex;justify-content:space-between;font-family:"Lora",Georgia,serif;font-size:24px;font-weight:700;margin:12px 0;padding-top:8px;border-top:2px solid var(--gr)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
input{font:inherit;font-size:16px;color:inherit;background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.mut{color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
td.w{white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stat{flex:1;min-width:130px}.stat b{font-family:"Lora",Georgia,serif;font-size:22px;display:block}
a.btn{display:block;text-align:center;text-decoration:none;color:var(--act);background:var(--ac);font-weight:600;border-radius:10px;padding:12px 14px;margin-bottom:8px}
nav{overflow-x:auto}nav button{flex:none;white-space:nowrap}
.low{color:var(--warn)}
.rc input{color:#222;background:#fff}.rc .li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
.tips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.tips button{padding:6px 10px}
a.btn.alt{background:var(--surf);color:var(--tx);border:1px solid var(--bd);font-weight:400}
.bar,.mob{display:none}
@media(max-width:799px){.bar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:10;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--hd);border-top:3px solid var(--gr)}.bar button{width:100%;padding:14px;font-size:16px}.mob{display:inline-block}main{padding-bottom:96px}}
@media(max-width:480px){.script{font-size:28px}.logo{width:52px;height:52px}header{padding:8px 12px}.brand{gap:10px}main{padding-left:10px;padding-right:10px}nav{padding:8px 10px}.topbar{padding:6px 10px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.rc{background:#fff;color:#222;border-radius:12px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.rc button{background:#f3f3f3;color:#222;border:1px solid #cfcfcf}.rc button.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}.rc button:disabled{opacity:.5}
.rc pre{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:0 0 12px}
.orders{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 0 10px}.orders button{flex:none;white-space:nowrap}
.warnb{background:#fbe9d0;color:#6b3a00;border-radius:8px;padding:8px 10px;margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,260px);background:#1f2410;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;transition:transform .25s;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.3)}#toast.on{transform:translate(-50%,0)}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;padding:0}.rc .row,.rc input{display:none}.rc{max-width:none}}
</style>
</head>

const isTok=v=>v&&typeof v=="object"&&("__inc" in v||"__del" in v);
function prune(o){Object.keys(o).forEach(k=>{const v=o[k];if(v&&typeof v=="object"&&!Array.isArray(v)&&!isTok(v)){prune(v);if(!Object.keys(v).length)delete o[k]}});return o}

}

function derive(){
 if(parts.length)return;

 if(o.tip&&o.tip.t)tipMode={t:o.tip.t,v:+o.tip.v||0};
}
function addQty(id,d){
 if(!cur)newOrder();

 else{const n=(+((o.lines||{})[id])||0)+d;op(cur,{lines:{[id]:cur!=="kota"&&n<=0?{__del:1}:{__inc:n<0?d-n:d}}})}
}

}

}

const tipAmt=()=>{const t=total();return tipMode.t=="pct"?Math.round(t*tipMode.v)/100:Math.max(0,Math.round(tipMode.v*100)/100)};
const grand=()=>Math.round((total()+tipAmt())*100)/100;
const paid=()=>Math.round(parts.reduce((a,p)=>a+p.amt,0)*100)/100;
const remaining=()=>Math.max(0,Math.round((grand()-paid())*100)/100);
const defaultAmt=()=>{const r=remaining(),done=parts.length-splitStart;return(splitN&&done<splitN-1)?Math.round(r/(splitN-done)*100)/100:r};
const due=()=>{const v=parseFloat(String(amtStr).replace(",","."));const r=remaining();return(amtStr!==""&&v>0)?Math.min(Math.round(v*100)/100,r):defaultAmt()};

function finalize(){
 const items=Object.entries(cart).filter(([id])=>prod(id)).map(([id,n])=>{const p=prod(id),o={name:p.name,price:p.price,qty:n};if(+id>0)o.pid=+id;if(p.dep)o.dep=p.dep;return o});

 if(parts.length>1)sale.payments=parts.map(p=>({amt:p.amt,pay:p.pay}));

function toWin(s){let o="";for(const ch of s){const c=ch.codePointAt(0);if(c<128)o+=ch;else if(c>=0xA0&&c<=0xFF)o+=String.fromCharCode(c);else if(c==0x20AC)o+="\x80";else if(c==0x2019)o+="'";else if(c==0x2013||c==0x2014)o+="-";else if(c==0x202F)o+=" ";else o+="?"}return o}
function ticketPdf(s){
 const lines=ticketText(s).replace(/€/g,"EUR").split("\n").flatMap(l=>wrapLine(l,34)).map(toWin);
 const W=226,M=14,FS=9.5,LH=12,LG=88;
 let jpg=null;const lg=document.querySelector(".logo");
 if(lg&&lg.complete&&lg.naturalWidth){try{const c=document.createElement("canvas");c.width=c.height=220;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,220,220);x.drawImage(lg,0,0,220,220);jpg=atob(c.toDataURL("image/jpeg",0.9).split(",")[1])}catch(e){jpg=null}}
 const H=Math.ceil(M*2+(jpg?LG+10:0)+lines.length*LH);
 const esc=x=>x.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
 let cs="";
 if(jpg)cs+="q "+LG+" 0 0 "+LG+" "+((W-LG)/2)+" "+(H-M-LG)+" cm /Im1 Do Q\n";
 let y=H-M-(jpg?LG+10:0)-FS;
 lines.forEach(l=>{cs+="BT /F1 "+FS+" Tf "+M+" "+y.toFixed(2)+" Td ("+esc(l)+") Tj ET\n";y-=LH});
 const ob=[];
 ob.push("<< /Type /Catalog /Pages 2 0 R >>");
 ob.push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
 ob.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 4 0 R >>"+(jpg?" /XObject << /Im1 6 0 R >>":"")+" >> /Contents 5 0 R >>");
 ob.push("<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>");
 ob.push("<< /Length "+cs.length+" >>\nstream\n"+cs+"endstream");
 if(jpg)ob.push("<< /Type /XObject /Subtype /Image /Width 220 /Height 220 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"+jpg+"\nendstream");
 let out="%PDF-1.4\n";const of=[];
 ob.forEach((o,i)=>{of.push(out.length);out+=(i+1)+" 0 obj\n"+o+"\nendobj\n"});
 const xr=out.length;
 out+="xref\n0 "+(ob.length+1)+"\n0000000000 65535 f \n"+of.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<< /Size "+(ob.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
 return new Blob([u],{type:"application/pdf"});
}
